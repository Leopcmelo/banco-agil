name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Testes e lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml; 3.12 é o que roda em dev.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff
        run: ruff check src tests app.py

      - name: black
        run: black --check src tests app.py

      # Sem GOOGLE_API_KEY de propósito: o suite roda offline, com o LLM
      # substituído por um dublê roteirizado e o HTTP de câmbio por respostas
      # fixas. Se algum teste passar a exigir rede ou chave, quebra aqui.
      - name: pytest
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Verificar cobertura mínima do núcleo
        run: |
          pytest -q --cov=src/core --cov-fail-under=100 \
            tests/test_score.py tests/test_limites.py tests/test_validadores.py
