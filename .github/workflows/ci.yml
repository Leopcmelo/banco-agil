name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Testes e lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado em pyproject.toml; 3.12 é o que roda em dev.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff
        run: ruff check src tests app.py

      - name: black
        run: black --check src tests app.py

      # Sem GOOGLE_API_KEY de propósito: o suite roda offline, com o LLM
      # substituído por um dublê roteirizado e o HTTP de câmbio por respostas
      # fixas. Se algum teste passar a exigir rede ou chave, quebra aqui.
      - name: pytest
        run: pytest -q --cov=src --cov-report=term-missing

      # A lista de testes do núcleo é derivada, não escrita à mão: um módulo
      # novo em src/core já quebrou a CI uma vez por ter sido adicionado sem
      # entrar nesta lista. test_estrutura.py garante que o par módulo/teste
      # exista; o glob garante que ele seja executado aqui.
      # A lista vem por xargs em vez de word-splitting da shell: o
      # comportamento de $(...) sem aspas difere entre bash e zsh, e validar
      # local de um jeito e na CI de outro foi exatamente o que deixou esta
      # verificação passar na minha máquina e quebrar no push.
      - name: Verificar cobertura mínima do núcleo
        run: |
          python scripts/testes_do_nucleo.py \
            | xargs pytest -q --cov=src/core --cov-fail-under=100
